spring.application.name=knowledge-assistant

# Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/knowledgeassist
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Docker Compose Support (Disabled to avoid errors if Docker is missing)
spring.docker.compose.enabled=false

# Server Configuration
server.port=8080

# Logging Configuration
logging.level.root=INFO
logging.level.com.haddad.springaiintegration=DEBUG
